AWSTemplateFormatVersion: '2010-09-09'
Description: Nate Dilgard personal website - S3 + CloudFront

Parameters:
  BucketName:
    Type: String
    Default: nate-dilgard-website
    Description: S3 bucket name (must be globally unique)

Resources:

  # --- S3 Bucket (private - CloudFront handles access) ---
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName

  # --- Origin Access Control (lets CloudFront read the private bucket) ---
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: NateDilgardWebsiteOAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- Bucket policy: only CloudFront can read objects ---
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # --- CloudFront Distribution (CDN + HTTPS) ---
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Nate Dilgard Personal Website
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100  # US, Canada, Europe (cheapest tier)

        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''  # Required empty string when using OAC
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # AWS managed CachingOptimized policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

        # Return index.html for unknown paths (handles direct page links)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /index.html

Outputs:
  BucketName:
    Description: S3 bucket — upload site files here
    Value: !Ref WebsiteBucket

  CloudFrontURL:
    Description: Your site URL (live after ~10 min)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  CloudFrontDistributionId:
    Description: Distribution ID — needed to clear cache after updates
    Value: !Ref CloudFrontDistribution
